{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="post-header">
        <h1>{{ title }} </h1>
        <p>Published on <time>{{ date }}</time></p>
    </div>
    
    <article class="markdown-body">
        {{content | safe }}
    </article>
{% endblock %}

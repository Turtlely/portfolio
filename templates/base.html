<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            {% block title %} 
            rtang.dev/ 
            {% endblock %}
        </title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="stylesheet" href="/markdown.css">
        <link rel="stylesheet" href="/pygments.css">
        <link rel="stylesheet" href="/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">    
        <script data-goatcounter="https://ryantang.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    </head>
    <body>
        <div class="page-container">
            <div class="page-contents">
                {% block header %}{% include "header.html" %}{% endblock %}
                {% block content %}{% endblock %}
            </div>
        </div>
    </body>   
    <footer style="display:flex; flex-direction: column; align-items: center;">
        <small>
            <p>join the mailing list if you want to hear about any new posts/updates</p>
        </small>
        <!-- Modify this form HTML and place wherever you want your form -->
        <form action="https://formspree.io/f/xrbgkkob" method="POST">
            <label>
            <input data-theme ='dark' type="email" name="email" autocomplete=off required placeholder="hello@world.com">
            </label>
            <button data-theme ='dark' type="submit">Join</button>
        </form>
    </footer>     
</html>
